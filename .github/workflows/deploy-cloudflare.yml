# Deploys MY FOOD to Cloudflare Workers (production host since 2026-10-15) after CI passes on main.
#
# Needs, in GitHub > Settings > Secrets and variables > Actions:
#   secret   CLOUDFLARE_API_TOKEN   (Cloudflare token: Account > Workers Scripts > Edit)
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable PROD_SUPABASE_URL, PROD_SUPABASE_ANON_KEY (public values, already used by the desktop build)
# Without the token the job explains what is missing and deploys nothing.
#
# Server secrets (DATABASE_URL, SUPABASE_SECRET_KEY, PIN_PEPPER, MONITOR_TOKEN) are NOT needed here:
# they are stored encrypted in the Worker and kept across deployments.
#
# Safety: database migrations are applied deliberately (forward-only), never by this job. If the code
# requires a newer schema than production has, the job stops before deploying.
name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Credentials present
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice::Automatic deployment is off: set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to turn it on."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.ok == 'true'
      - name: Production already has the database schema this code needs
        if: steps.creds.outputs.ok == 'true'
        run: |
          required=$(ls supabase/migrations/*.sql | sort | tail -1 | xargs basename | cut -c1-14)
          live=$(curl -sf https://www.chefelisha.cc/health/ready | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.checks.schema.detail.database)})")
          echo "code needs $required, production has $live"
          if [ "$live" \< "$required" ]; then
            echo "::error::Apply migration(s) up to $required to production first (supabase db push), then re-run this job."
            exit 1
          fi
      - name: Public build values
        if: steps.creds.outputs.ok == 'true'
        run: |
          {
            echo "SUPABASE_URL=${{ vars.PROD_SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ vars.PROD_SUPABASE_ANON_KEY }}"
            echo "VITE_SUPABASE_URL=${{ vars.PROD_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ vars.PROD_SUPABASE_ANON_KEY }}"
          } > .env.ci
      - name: Build and deploy
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare/deploy.mjs production .env.ci
      - name: Live site is ready
        if: steps.creds.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            curl -sf https://www.chefelisha.cc/health/ready | grep -q '"status":"ready"' && { echo "ready"; exit 0; }
            sleep 6
          done
          echo "::error::https://www.chefelisha.cc/health/ready did not report ready after deployment"; exit 1
