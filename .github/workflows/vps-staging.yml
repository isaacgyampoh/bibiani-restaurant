name: VPS staging (throwaway server)

# Deploys MY FOOD onto the shared central platform (isaacgyampoh/everytinroom-pos, deploy/) on a
# disposable Ubuntu runner, exactly as on the future Contabo server, and tests it end to end.
# NO production credential or data is used: every secret is generated here and dies with the
# runner; the restaurant is a synthetic test tenant.
#
#  1 the platform's bootstrap.sh installs Docker and the shared stack from scratch
#  2 migration-package/deploy.sh provisions Auth + Storage + Realtime and starts MY FOOD
#  3 a test restaurant is created, and the full browser suite runs against it
#  4 logins migrated as rows (bcrypt hash, refresh token) work on the self-hosted Auth
#  5 backup -> restore -> reconcile with the real cutover scripts; the app still works
#  6 deploy.sh run a second time changes nothing (idempotent)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'migration-package/**'
      - '.github/workflows/vps-staging.yml'

# bash -eo pipefail for every step: a failure inside `cmd | tee log` must fail the step.
defaults:
  run:
    shell: bash

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SUPA: supabase-myfood.staging.test
      WEB: www-myfood.staging.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: isaacgyampoh/everytinroom-pos
          path: platform
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 1. Platform bootstrap (Docker + shared stack, from scratch)
        run: |
          chmod +x platform/deploy/*.sh platform/deploy/scripts/*.sh
          sudo platform/deploy/bootstrap.sh --acme-email staging@example.invalid --yes --no-firewall
          echo "127.0.0.1 $SUPA $WEB" | sudo tee -a /etc/hosts

      - name: S3 stand-in for Cloudflare R2 (SeaweedFS, as the platform's own test)
        run: |
          sudo docker run -d --name staging-s3 --network central_edge chrislusf/seaweedfs:4.52 \
            server -s3 -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=64
          for i in $(seq 1 40); do
            c=$(sudo docker run --rm --network central_edge curlimages/curl:8.11.1 -s -o /dev/null -w '%{http_code}' http://staging-s3:8333/ || true)
            case "$c" in 200|403|404) break ;; esac; sleep 3
          done
          sudo docker run --rm --network central_edge curlimages/curl:8.11.1 -s -X PUT http://staging-s3:8333/myfood-images

      - name: 2. Deploy MY FOOD
        env:
          MYFOOD_R2_BUCKET: myfood-images
          MYFOOD_R2_ENDPOINT: http://staging-s3:8333
          MYFOOD_R2_ACCESS_KEY_ID: staging
          MYFOOD_R2_SECRET_ACCESS_KEY: staging-secret
          MYFOOD_R2_REGION: us-east-1
        run: |
          sudo -E migration-package/deploy.sh --supabase-host "$SUPA" --web-host "$WEB" \
            --staging --plain-http --realtime 2>&1 | tee /tmp/deploy-1.log

      - name: Test values (generated on this runner only)
        run: |
          get() { sudo sed -n "s/^$2=//p" "$1" | tail -1; }
          A=/srv/central/apps/myfood/.env; M=/srv/central/apps/myfood/myfood.env
          {
            echo "SUPABASE_URL=http://$SUPA"
            echo "SUPABASE_ANON_KEY=$(get $A ANON_KEY)"
            echo "SUPABASE_SECRET_KEY=$(get $A SERVICE_ROLE_KEY)"
            echo "PLATFORM_DATABASE_URL=postgresql://postgres:$(get /srv/central/.env POSTGRES_PASSWORD)@127.0.0.1:5432/myfood"
            echo "STAGING_JWT_SECRET=$(get $A JWT_SECRET)"
            echo "STAGING_PIN_PEPPER=$(get $M PIN_PEPPER)"
          } > .env.vps
          chmod 600 .env.vps
          while IFS= read -r line; do echo "::add-mask::${line#*=}"; done < .env.vps

      - name: Browser path preflight (CORS, sign-in, recovery link) — stops early if broken
        run: |
          bash scripts/env/fresh-restaurant.sh .env.vps "http://$WEB" .vps-accounts.json
          set -a; . ./.env.vps; set +a
          EMAIL=$(node -p "require('./.vps-accounts.json').accounts.owner.email")
          PASS=$(node -p "require('./.vps-accounts.json').accounts.owner.password"); echo "::add-mask::$PASS"
          echo "--- CORS preflight from the web origin to the Auth host"
          curl -s -o /dev/null -D - -X OPTIONS "http://$SUPA/auth/v1/token?grant_type=password" \
            -H "Origin: http://$WEB" -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: apikey,authorization,content-type,x-client-info,x-supabase-api-version' | tee /tmp/cors.txt
          echo "--- password sign-in as the browser sends it"
          curl -s -o /tmp/token.json -w '%{http_code}\n' -D /tmp/token-headers.txt -X POST "http://$SUPA/auth/v1/token?grant_type=password" \
            -H "Origin: http://$WEB" -H "apikey: $SUPABASE_ANON_KEY" -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}"
          grep -i '^access-control' /tmp/token-headers.txt || echo "(no CORS headers on the sign-in response)"
          node -e 'const j=require("/tmp/token.json");console.log("token keys:",Object.keys(j).join(","),"error:",j.error||j.msg||j.error_description||"none")'
          echo "--- recovery link (admin)"
          curl -s -X POST "http://$SUPA/auth/v1/admin/generate_link" -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" -H 'content-type: application/json' \
            -d "{\"type\":\"recovery\",\"email\":\"$EMAIL\",\"redirect_to\":\"http://$WEB/set-password\"}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("keys:",Object.keys(j).join(","),"error:",j.msg||j.error||"none",j.code||"")})'
          grep -qi '^access-control-allow-origin' /tmp/cors.txt || { echo "::error::the Auth host answers no CORS for the web origin: browsers cannot sign in"; exit 1; }

      - name: 3. Test restaurant, then the full browser suite
        run: |
          npx playwright install --with-deps chromium >/dev/null
          E2E_BASE_URL="http://$WEB" E2E_INSECURE_ORIGIN="http://$WEB,http://$SUPA" ACCOUNTS_FILE=.vps-accounts.json \
            node --env-file=.env.vps node_modules/@playwright/test/cli.js test 2>&1 | tee /tmp/e2e-1.log
          test "${PIPESTATUS[0]}" = 0

      - name: 4. Logins carried over as rows work on the self-hosted Auth
        run: node --env-file=.env.vps migration-package/scripts/auth-carryover-test.mjs

      - name: Photos round trip into Storage (R2 stand-in), verified by retrieval
        run: |
          D=$(mktemp -d); mkdir -p "$D/product-images/test"
          for i in 1 2 3; do head -c $((20000 + i)) /dev/urandom > "$D/product-images/test/photo-$i.webp"; done
          node -e '
            const fs=require("fs"),c=require("crypto"),d=process.argv[1];
            const m=[1,2,3].map(i=>{const n=`test/photo-${i}.webp`,b=fs.readFileSync(`${d}/product-images/${n}`);
              return {name:n,size:b.length,type:"image/webp",sha256:c.createHash("sha256").update(b).digest("hex")}});
            fs.writeFileSync(`${d}/manifest.json`,JSON.stringify(m));' "$D"
          set -a; . ./.env.vps; set +a
          STORAGE_URL="http://$SUPA/storage/v1" SERVICE_KEY="$SUPABASE_SECRET_KEY" node migration-package/scripts/upload-photos.mjs "$D"
          node -e 'const f=process.argv[1]+"/manifest.json",m=JSON.parse(require("fs").readFileSync(f));m[0].sha256="0".repeat(64);require("fs").writeFileSync(f,JSON.stringify(m))' "$D"
          if STORAGE_URL="http://$SUPA/storage/v1" SERVICE_KEY="$SUPABASE_SECRET_KEY" node migration-package/scripts/upload-photos.mjs "$D"; then
            echo "::error::a wrong checksum was not detected"; exit 1
          fi
          echo "control: a wrong checksum is detected"

      - name: Postgres 18 client (backups are written by pg_dump 18)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-18 >/dev/null
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: 5. Backup -> double restore -> reconcile -> restore to the server -> app still works
        run: |
          mkdir -p ~/restaurant-migration/backups && chmod 700 ~/restaurant-migration ~/restaurant-migration/backups
          D=~/restaurant-migration/backups/myfood-staging-$(date -u +%Y%m%dT%H%M%SZ).dump
          set -a; . ./.env.vps; set +a
          node --env-file=.env.vps migration-package/scripts/auth-carryover-test.mjs --before
          pg_dump "$PLATFORM_DATABASE_URL" -Fc --no-owner --no-acl -f "$D"
          sha256sum "$D" | awk '{print $1}' > "$D.sha256"
          bash migration-package/scripts/restore-and-reconcile.sh "$D"
          printf '%s' "$STAGING_PIN_PEPPER" > /tmp/pepper && chmod 600 /tmp/pepper
          sudo cp "$D" "$D.sha256" "$D.fingerprint.json" /root/
          sudo -E migration-package/deploy.sh --supabase-host "$SUPA" --web-host "$WEB" \
            --staging --plain-http --realtime \
            --restore "/root/$(basename "$D")" --pin-pepper-file /tmp/pepper 2>&1 | tee /tmp/deploy-2.log
          test "${PIPESTATUS[0]}" = 0
          node --env-file=.env.vps migration-package/scripts/auth-carryover-test.mjs --after
          E2E_BASE_URL="http://$WEB" E2E_INSECURE_ORIGIN="http://$WEB,http://$SUPA" ACCOUNTS_FILE=.vps-accounts.json \
            node --env-file=.env.vps node_modules/@playwright/test/cli.js test e2e/pin.spec.ts e2e/milestone.spec.ts

      - name: 6. Running deploy.sh again changes nothing
        run: |
          sudo -E migration-package/deploy.sh --supabase-host "$SUPA" --web-host "$WEB" \
            --staging --plain-http --realtime 2>&1 | tee /tmp/deploy-3.log
          grep -q "applied 0, already present" /tmp/deploy-3.log

      - name: Negative control — the suite must fail when the API is down
        run: |
          sudo docker stop myfood-api >/dev/null
          if E2E_BASE_URL="http://$WEB" E2E_INSECURE_ORIGIN="http://$WEB,http://$SUPA" ACCOUNTS_FILE=.vps-accounts.json \
               node --env-file=.env.vps node_modules/@playwright/test/cli.js test e2e/zz-qa-prod-readonly.spec.ts >/tmp/neg.log 2>&1; then
            echo "::error::the readiness test passed with the API stopped"; exit 1
          fi
          echo "failed as expected with the API stopped"
          sudo docker start myfood-api >/dev/null

      - name: Logs from anything unhealthy
        if: always()
        run: |
          sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          for c in myfood-api myfood-web myfood-auth myfood-storage myfood.realtime central-caddy; do
            echo "===== $c ====="; sudo docker logs "$c" --tail=40 2>&1 || true
          done

      - name: Evidence
        if: always()
        run: |
          mkdir -p evidence && cp /tmp/deploy-*.log /tmp/e2e-*.log /tmp/cors.txt evidence/ 2>/dev/null || true
          find test-results -name error-context.md 2>/dev/null | head -20 | while read f; do cp "$f" "evidence/$(basename "$(dirname "$f")").md"; done
          find ~/restaurant-migration -path '*evidence/*' \( -name '*.txt' -o -name '*.log' \) -exec cp {} evidence/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vps-staging-evidence
          path: evidence/
          retention-days: 30
