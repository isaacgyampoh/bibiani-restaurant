name: MY FOOD Hub and MY FOOD Printing (Windows installers)

# Builds the PRODUCTION MY FOOD Hub installer on a real Windows machine.
#  - Run by hand (Actions tab): the installer is attached to the run as an artifact.
#  - Push a tag v<version> (matching apps/desktop/package.json): the installer is published as a
#    GitHub Release, which is where restaurants download it and where installed hubs get updates.
# Only public values are used: apps/desktop/production.public.json (repository variables
# PROD_SUPABASE_URL / PROD_SUPABASE_ANON_KEY override it when set). The build refuses anything that
# is not the production Supabase project, a non-anon key, or a cloud address that is not production,
# and the result is checked again for staging values before anything is uploaded.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "::error::Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }

      - name: Public production values (repository variables override the committed file)
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env.hub
            echo "ENV_ARG=--env .env.hub" >> "$GITHUB_ENV"
          fi

      - name: Build app (production channel)
        working-directory: apps/desktop
        run: node build.mjs --channel production ${{ env.ENV_ARG }}

      - name: Check the build is production (and not staging)
        shell: bash
        working-directory: apps/desktop
        run: |
          grep -q '"channel":"production"' app/build-info.json
          grep -q 'lgoirbfyspuflqekrcgp.supabase.co' app/main.cjs
          if grep -rq 'impairlsvhkumjzhjhti\|restaurant-management-staging' app/main.cjs app/web; then
            echo "::error::Staging values found in a production build"; exit 1
          fi
          cat app/build-info.json

      - name: Package installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.generated.json --win nsis --x64 --publish never

      - name: Package and publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --config electron-builder.generated.json --win nsis --x64 --publish always

      - uses: actions/upload-artifact@v4
        with:
          name: MY-FOOD-Hub-production-${{ github.sha }}
          path: apps/desktop/release/MY-FOOD-Hub-Setup-*-production.exe
          if-no-files-found: error

      # MY FOOD Printing: the print program for a restaurant PC (same guards as the hub).
      - name: Build MY FOOD Printing (production channel)
        working-directory: apps/desktop
        run: node build.mjs --app printing --channel production ${{ env.ENV_ARG }}

      - name: Check MY FOOD Printing is production (and not staging)
        shell: bash
        working-directory: apps/desktop
        run: |
          grep -q '"channel":"production"' app-printing/build-info.json
          grep -q 'lgoirbfyspuflqekrcgp.supabase.co' app-printing/main.cjs
          if grep -rq 'impairlsvhkumjzhjhti\|restaurant-management-staging' app-printing; then
            echo "::error::Staging values found in the production printing build"; exit 1
          fi
          cat app-printing/build-info.json

      - name: Package MY FOOD Printing
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.printing.generated.json --win nsis --x64 --publish never

      - name: Package and publish MY FOOD Printing
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --config electron-builder.printing.generated.json --win nsis --x64 --publish always

      - uses: actions/upload-artifact@v4
        with:
          name: MY-FOOD-Printing-production-${{ github.sha }}
          path: apps/desktop/release-printing/MY-FOOD-Printing-Setup.exe
          if-no-files-found: error
