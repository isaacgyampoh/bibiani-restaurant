<!--
  MY FOOD — "Reset / verify" email (Supabase Auth: Recovery template).
  Used for: owner email verification (onboarding), password reset, staff PIN recovery links.
  Subject: MY FOOD — confirm it's you
  Apply: Supabase dashboard → Authentication → Emails → "Reset password", after connecting custom SMTP.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #eceef1;border-radius:14px;">
        <tr>
          <td style="background:#c81c23;border-radius:14px 14px 0 0;padding:20px 28px;color:#ffffff;">
            <div style="font-size:20px;font-weight:bold;">MY FOOD</div>
            <div style="font-size:14px;">Chefelisha Restaurant</div>
          </td>
        </tr>
        <tr>
          <td style="padding:28px;color:#111418;font-size:15px;line-height:1.5;">
            <p style="margin:0 0 12px;font-size:18px;font-weight:bold;">Confirm it's you</p>
            <p style="margin:0 0 20px;">Use the button below to continue to MY FOOD for <strong>{{ .Email }}</strong>. The link works once and expires after one hour.</p>
            <p style="margin:0 0 24px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#e32129;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:10px;">Continue to MY FOOD</a>
            </p>
            <p style="margin:0;color:#666e7b;font-size:13px;">If you did not ask for this, ignore this email. Nobody can sign in without this link.</p>
          </td>
        </tr>
      </table>
      <p style="color:#666e7b;font-size:12px;margin-top:14px;">Food is better than love</p>
    </td>
  </tr>
</table>
